site_name: Codelogium
site_description: "Codelogium is Al-Fahami Toihir's learning journal: notes on CS fundamentals, C, Java, Spring and real-world engineering, written while figuring it out."
site_author: Al-Fahami Toihir
site_url: https://codelogium.com/
repo_url: https://github.com/alfahami/codelogium.github.io
repo_name: alfahami/codelogium

theme:
  name: material
  language: en
  custom_dir: overrides
  favicon: assets/favicon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - content.tabs.link
    - content.code.copy
    - search.suggest
    - content.code.annotate
    - search.highlight

markdown_extensions:
  - toc:
      title: "On this page"
      permalink: "¶"
      permalink_title: Permalink
      toc_depth: "1-6"
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables


extra:
  pagetime: 'on'
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alfahami
      name: alfahami on Github
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/alfahami
      name: alfahami on LinkedIn
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/al_fahami
      name: alfahami on X
  # Cloudflare Web Analytics is also loaded, in overrides/main.html
  analytics:
    provider: google
    property: G-9L21ZFFY2J
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/codelogium/codelogium.github.io/issues/new?title=Feedback%3A+{title}&body=Page%3A+{url}%0A%0AWhat+could+be+better%3F%0A" target="_blank" rel="noopener">opening an issue on GitHub</a>.

copyright: © 2026 <a href="https://codelogium.com/">Codelogium</a> • Crafted with curiosity accompanied by a cup of tea ☕

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascript/extra.js

plugins:
  - search:
  - awesome-nav:
  - blog:
      authors: true
  - tags
  # - social: can be installed later preferably in a linux machine
  - social:
      enabled: !ENV [CI, false]
      cards_layout_options:
        background_color: "#0E7A60"
        color: "#FFFFFF"
        font_family: Inter
